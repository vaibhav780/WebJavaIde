<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Java Web IDE - Interactive Terminal & Visual Debugger</title>
    <!-- Monaco Editor CSS -->
    <link rel="stylesheet" data-name="vs/editor" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.min.css">
    <!-- xterm.js Terminal CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; margin: 0; padding: 12px; background: #18181c; color: #e0e0e6; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .top-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; height: 44px; background: #202026; padding: 0 14px; border-radius: 8px; border: 1px solid #2e2e38; }
        input, select { padding: 7px 12px; background: #121215; border: 1px solid #363644; color: #fff; border-radius: 6px; font-family: inherit; font-size: 13px; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus { border-color: #6366f1; }
        button { padding: 7px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; color: white; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s ease; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        .btn-run { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25); }
        .btn-debug { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25); }
        
        .status-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-left: auto; background: #121215; padding: 4px 10px; border-radius: 20px; border: 1px solid #2e2e38; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
        .status-dot.connected { background: #10b981; box-shadow: 0 0 6px #10b981; }

        /* Debugger Controls Bar */
        .debug-bar { display: none; gap: 8px; background: #2a2a34; padding: 4px 12px; border-radius: 6px; align-items: center; border: 1px solid #3d3d4e; }
        .debug-bar button { padding: 4px 10px; font-size: 12px; background: #3b3b4f; }
        .debug-bar button:hover { background: #4c4c63; }

        .workspace-container { display: flex; flex: 1; gap: 10px; height: calc(100vh - 74px); }

        /* Sidebar Tree View */
        .sidebar { width: 220px; background: #202026; border: 1px solid #2e2e38; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { padding: 10px 12px; font-weight: 600; background: #19191e; border-bottom: 1px solid #2e2e38; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #a1a1aa; letter-spacing: 0.5px; }
        .file-item { padding: 8px 12px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; transition: background 0.15s; color: #c4c4ce; }
        .file-item:hover { background: #2a2a34; }
        .file-item.active { background: #2e2e3d; font-weight: 600; color: #818cf8; border-left: 3px solid #6366f1; }

        /* Main Workspace Layout */
        .main-pane { flex: 1; display: flex; flex-direction: column; gap: 10px; height: 100%; }
        .editor-row { display: flex; flex: 3; gap: 10px; min-height: 300px; }
        
        #editor-container { flex: 3; border: 1px solid #2e2e38; border-radius: 8px; position: relative; height: 100%; min-height: 300px; background: #1e1e1e; overflow: hidden; }
        #editor { width: 100%; height: 100%; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
        
        /* Breakpoint Margin Glyph */
        .breakpoint-glyph { background: #ef4444; width: 10px !important; height: 10px !important; border-radius: 50%; margin-left: 5px; margin-top: 5px; box-shadow: 0 0 6px rgba(239, 68, 68, 0.8); }

        /* Variables & Debug Side Panel */
        .debug-panel { flex: 1; background: #202026; border: 1px solid #2e2e38; border-radius: 8px; padding: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; overflow-y: auto; color: #a1a1aa; }
        .debug-panel h4 { margin: 0 0 10px 0; color: #f59e0b; border-bottom: 1px solid #2e2e38; padding-bottom: 6px; font-size: 12px; letter-spacing: 0.5px; }

        /* Bottom Terminal Container */
        .terminal-pane { flex: 2; background: #0c0c0e; border: 1px solid #2e2e38; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; min-height: 180px; position: relative; }
        .terminal-header { font-size: 11px; font-weight: 600; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: flex; justify-content: space-between; }
        #terminal { flex: 1; width: 100%; height: 100%; overflow: hidden; position: relative; }
    </style>
</head>
<body>

    <div class="top-bar">
        <input type="text" id="jdkPath" placeholder="JDK Path (auto-detected if blank)" style="width: 260px;" />
        <label style="font-size: 13px; color: #a1a1aa;">Main Class:</label>
        <select id="targetClassSelect"></select>

        <button class="btn-run" onclick="runInteractive()">▶ Run Code</button>
        <button class="btn-debug" onclick="startDebugger()">🐞 Debug Program</button>

        <!-- Debug Toolbar -->
        <div id="debugBar" class="debug-bar">
            <span style="color:#f59e0b; font-weight:600; font-size:12px;">DEBUGGING:</span>
            <button onclick="sendDebugCommand('cont')">▶ Continue (F5)</button>
            <button onclick="sendDebugCommand('step')">⤵ Step Into (F11)</button>
            <button onclick="sendDebugCommand('next')">↷ Step Over (F10)</button>
        </div>

        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>

    <div class="workspace-container">
        <!-- Sidebar File Tree -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>PROJECT FILES</span>
                <button style="padding:3px 8px; font-size:11px; background:#3f3f46;" onclick="createNewFile()">+ File</button>
            </div>
            <div id="fileList"></div>
        </div>

        <div class="main-pane">
            <div class="editor-row">
                <div id="editor-container">
                    <div id="editor"></div>
                </div>
                <!-- Debug Variables Panel -->
                <div class="debug-panel">
                    <h4>VARIABLES & STACK</h4>
                    <div id="variablesView">Start debugging or hit a breakpoint to inspect memory...</div>
                </div>
            </div>
            
            <!-- Terminal Container -->
            <div class="terminal-pane">
                <div class="terminal-header">
                    <span>INTERACTIVE TERMINAL</span>
                    <button style="padding:2px 6px; font-size:10px; background:#27272a; color:#a1a1aa;" onclick="clearTerminal()">Clear</button>
                </div>
                <div id="terminal"></div>
            </div>
        </div>
    </div>

    <!-- Scripts with Fallbacks -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.3.0/xterm.min.js"></script>
    
    <script>
        // Universal Terminal Wrapper: Handles xterm.js if available, or native HTML terminal if CDN blocked
        class UniversalTerminal {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                if (typeof Terminal !== 'undefined') {
                    try {
                        this.isXterm = true;
                        this.xterm = new Terminal({
                            theme: {
                                background: '#0c0c0e',
                                foreground: '#f4f4f5',
                                cursor: '#818cf8',
                                selectionBackground: 'rgba(99, 102, 241, 0.3)'
                            },
                            cursorBlink: true,
                            fontSize: 13,
                            fontFamily: 'JetBrains Mono, monospace',
                            convertEol: true
                        });
                        this.xterm.open(this.container);
                    } catch (e) {
                        console.warn("xterm init failed, falling back to Native Terminal:", e);
                        this.isXterm = false;
                        this.setupFallback();
                    }
                } else {
                    console.warn("xterm.js not loaded. Using Native HTML Terminal fallback.");
                    this.isXterm = false;
                    this.setupFallback();
                }
            }

            setupFallback() {
                this.container.innerHTML = `
                    <div id="fallback-term-output" style="width:100%; height:calc(100% - 28px); background:#0c0c0e; color:#00ff66; font-family:JetBrains Mono, monospace; font-size:13px; padding:8px; overflow-y:auto; white-space:pre-wrap; word-break:break-all;"></div>
                    <div style="display:flex; height:28px; background:#18181c; border-top:1px solid #2e2e38;">
                        <span style="padding:4px 8px; color:#818cf8; font-family:monospace; font-size:12px;">&gt;</span>
                        <input id="fallback-term-input" placeholder="Type input here and press Enter..." style="flex:1; background:transparent; border:none; color:#fff; font-family:monospace; font-size:13px; outline:none;" />
                    </div>
                `;
                this.output = document.getElementById('fallback-term-output');
                this.input = document.getElementById('fallback-term-input');

                if (this.input) {
                    this.input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            const val = this.input.value;
                            this.input.value = '';
                            if (this.dataCallback) {
                                this.dataCallback(val + '\r');
                            }
                        }
                    });
                }
            }

            write(data) {
                if (this.isXterm && this.xterm) {
                    this.xterm.write(data);
                } else if (this.output) {
                    const cleanText = data.replace(/\x1b\[[0-9;]*m/g, '');
                    this.output.textContent += cleanText;
                    this.output.scrollTop = this.output.scrollHeight;
                }
            }

            clear() {
                if (this.isXterm && this.xterm) {
                    this.xterm.clear();
                } else if (this.output) {
                    this.output.textContent = '';
                }
            }

            onData(callback) {
                if (this.isXterm && this.xterm) {
                    this.xterm.onData(callback);
                } else {
                    this.dataCallback = callback;
                }
            }
        }

        let editor, term, ws;
        let activeFileId = '1';
        let breakpoints = [];
        let debugDecorations = [];

        // Sample Program Source Code
        const SAMPLE_JAVA_CODE = `import java.util.Scanner;

public class Main {
    public static void main(String[] args) {
        Scanner scanner = new Scanner(System.in);
        System.out.print("Enter your name: ");
        String name = scanner.nextLine();
        
        System.out.print("Enter first number: ");
        int a = scanner.nextInt();
        
        System.out.print("Enter second number: ");
        int b = scanner.nextInt();
        
        int sum = calculateSum(a, b);
        
        System.out.println("\\nHello " + name + ", the calculated sum is: " + sum);
    }

    public static int calculateSum(int x, int y) {
        return x + y;
    }
}`;

        let files = [
            {
                id: '1',
                name: 'Main.java',
                path: 'Main.java',
                content: SAMPLE_JAVA_CODE
            }
        ];

        // 1. Initialize Universal Terminal
        window.addEventListener('DOMContentLoaded', () => {
            term = new UniversalTerminal('terminal');
            if (term) {
                term.onData(data => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'terminal_input', input: data }));
                    }
                });
            }
        });

        function clearTerminal() {
            if (term) term.clear();
        }

        // 2. WebSocket Connection with Auto-Reconnect
        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}`);

            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            ws.onopen = () => {
                if (dot) dot.classList.add('connected');
                if (text) text.textContent = 'Connected (WS)';
                if (term) term.write('\r\n\x1b[32m[Connected to IDE Server]\x1b[0m\r\n');
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'output' && term) {
                        term.write(msg.data);
                    }
                    
                    if (msg.type === 'debug_event' && msg.event === 'stopped') {
                        highlightDebugLine(msg.line);
                    }

                    if (msg.type === 'debug_vars') {
                        document.getElementById('variablesView').textContent = msg.data;
                    }
                } catch (err) {
                    console.error("Error parsing WebSocket message:", err);
                }
            };

            ws.onclose = () => {
                if (dot) dot.classList.remove('connected');
                if (text) text.textContent = 'HTTP Mode';
                setTimeout(connectWebSocket, 5000);
            };

            ws.onerror = (err) => {
                console.warn("WebSocket status warning:", err);
            };
        }

        connectWebSocket();

        // 3. Render Sidebar First
        renderSidebar();

        // 4. Initialize Monaco Editor Safely
        function initMonaco() {
            if (typeof require === 'undefined') {
                console.warn("Monaco loader.min.js not available. Using fallback textarea.");
                showFallbackTextarea();
                return;
            }

            require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
            require(['vs/editor/editor.main'], function() {
                try {
                    editor = monaco.editor.create(document.getElementById('editor'), {
                        value: files[0].content,
                        language: 'java',
                        theme: 'vs-dark',
                        automaticLayout: true,
                        glyphMargin: true
                    });

                    editor.onMouseDown(e => {
                        if (e.target.type === monaco.editor.MouseTargetType.GUTTER_GLYPH_MARGIN) {
                            const lineNumber = e.target.position.lineNumber;
                            toggleBreakpoint(lineNumber);
                        }
                    });

                    editor.onDidChangeModelContent(() => {
                        syncEditorContent();
                    });

                } catch (err) {
                    console.warn("Monaco Editor Initialization Error:", err);
                    showFallbackTextarea();
                }
            }, function(err) {
                console.warn("Failed to load Monaco vs/editor:", err);
                showFallbackTextarea();
            });
        }

        function syncEditorContent() {
            const currentFile = files.find(f => f.id === activeFileId);
            if (!currentFile) return;
            if (editor) {
                currentFile.content = editor.getValue();
            } else {
                const fallback = document.getElementById('fallback-editor');
                if (fallback) currentFile.content = fallback.value;
            }
        }

        function showFallbackTextarea() {
            const container = document.getElementById('editor-container');
            container.innerHTML = `<textarea id="fallback-editor" style="width:100%; height:100%; background:#1e1e1e; color:#00ff66; font-family:JetBrains Mono, monospace; padding:12px; border:none; outline:none; resize:none;">${files[0].content}</textarea>`;
            const textarea = document.getElementById('fallback-editor');
            textarea.addEventListener('input', () => {
                syncEditorContent();
            });
        }

        window.addEventListener('load', initMonaco);

        function toggleBreakpoint(lineNumber) {
            const currentFile = files.find(f => f.id === activeFileId);
            if (!currentFile) return;
            const className = currentFile.path.replace(/\.java$/, '');
            
            const existingIdx = breakpoints.findIndex(bp => bp.className === className && bp.lineNumber === lineNumber);
            if (existingIdx >= 0) {
                breakpoints.splice(existingIdx, 1);
            } else {
                breakpoints.push({ className, lineNumber });
            }

            updateBreakpointDecorations();
        }

        function updateBreakpointDecorations() {
            if (!editor) return;
            const currentFile = files.find(f => f.id === activeFileId);
            if (!currentFile) return;
            const className = currentFile.path.replace(/\.java$/, '');
            const currentBps = breakpoints.filter(bp => bp.className === className);

            const decorations = currentBps.map(bp => ({
                range: new monaco.Range(bp.lineNumber, 1, bp.lineNumber, 1),
                options: { isWholeLine: false, glyphMarginClassName: 'breakpoint-glyph' }
            }));

            editor.deltaDecorations([], decorations);
        }

        function highlightDebugLine(lineNumber) {
            if (!lineNumber || !editor) return;
            debugDecorations = editor.deltaDecorations(debugDecorations, [
                {
                    range: new monaco.Range(lineNumber, 1, lineNumber, 1),
                    options: { isWholeLine: true, className: 'monaco-breakpoint-hit-line', linesDecorationsClassName: 'active-debug-line' }
                }
            ]);
            editor.revealLine(lineNumber);
        }

        async function runInteractive() {
            syncEditorContent();
            if (term) {
                term.clear();
                term.write('\r\n\x1b[33mCompiling project...\x1b[0m\r\n');
            }

            document.getElementById('debugBar').style.display = 'none';
            const mainClass = document.getElementById('targetClassSelect').value || 'Main';
            const jdkPath = document.getElementById('jdkPath').value;

            // Priority 1: WebSocket if connected
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'run_interactive', files, mainClass, jdkPath }));
            } else {
                // Priority 2: HTTP POST /api/run fallback if WebSocket blocked or disconnected
                try {
                    if (term) term.write('\x1b[90m[Using HTTP API fallback]\x1b[0m\r\n');
                    const res = await fetch('/api/run', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ files, mainClass, jdkPath })
                    });
                    const data = await res.json();
                    if (term) {
                        term.write(`\r\n${data.output.replace(/\n/g, '\r\n')}\r\n`);
                    }
                } catch (err) {
                    if (term) term.write(`\r\n\x1b[31mError sending run request: ${err.message}\x1b[0m\r\n`);
                }
            }
        }

        function startDebugger() {
            syncEditorContent();
            if (term) {
                term.clear();
                term.write('\r\n\x1b[33mStarting Debugger...\x1b[0m\r\n');
            }
            document.getElementById('debugBar').style.display = 'flex';
            const mainClass = document.getElementById('targetClassSelect').value || 'Main';
            const jdkPath = document.getElementById('jdkPath').value;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'debug_start', files, mainClass, breakpoints, jdkPath }));
            } else {
                if (term) term.write('\r\n\x1b[31mVisual debugger requires WebSocket connection.\x1b[0m\r\n');
            }
        }

        function sendDebugCommand(cmd) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'debug_command', command: cmd }));
            }
        }

        function renderSidebar() {
            const listEl = document.getElementById('fileList');
            const selectEl = document.getElementById('targetClassSelect');
            if (!listEl || !selectEl) return;
            
            listEl.innerHTML = ''; selectEl.innerHTML = '';

            files.forEach(file => {
                const item = document.createElement('div');
                item.className = `file-item ${file.id === activeFileId ? 'active' : ''}`;
                item.onclick = () => selectFile(file.id);
                item.innerHTML = `<span>📄 ${file.path}</span>`;
                listEl.appendChild(item);

                const className = file.path.replace(/\.java$/, '');
                const option = document.createElement('option');
                option.value = className; option.textContent = className;
                selectEl.appendChild(option);
            });
        }

        function selectFile(id) {
            syncEditorContent();
            activeFileId = id;
            const file = files.find(f => f.id === id);
            if (file) {
                if (editor) {
                    editor.setValue(file.content);
                } else {
                    const fallback = document.getElementById('fallback-editor');
                    if (fallback) fallback.value = file.content;
                }
            }
            renderSidebar();
            updateBreakpointDecorations();
        }

        function createNewFile() {
            syncEditorContent();
            const filePath = prompt("Enter file path (e.g. Service.java):");
            if (!filePath) return;
            const className = filePath.replace(/\.java$/, '');
            const newFile = { id: Date.now().toString(), name: filePath, path: filePath, content: `public class ${className} {\n\n}` };
            files.push(newFile);
            selectFile(newFile.id);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/jdk-path');
                const data = await res.json();
                if (data.jdkPath) document.getElementById('jdkPath').value = data.jdkPath;
            } catch (e) {
                console.warn("Could not fetch default JDK path", e);
            }
        });
    </script>
</body>
</html>
