<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Java Web IDE - Multi-file Workspace</title>
    <link rel="stylesheet" data-name="vs/editor" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 15px; background: #1e1e1e; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        
        .top-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
        input, select { padding: 8px 12px; background: #2d2d2d; border: 1px solid #454545; color: #fff; border-radius: 4px; }
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; color: white; }
        .btn-run { background: #0e639c; }
        .btn-run:hover { background: #1177bb; }
        .btn-test { background: #28a745; }
        .btn-test:hover { background: #218838; }

        .workspace-container { display: flex; flex: 1; gap: 12px; min-height: 0; }

        /* Sidebar File Tree */
        .sidebar { width: 260px; background: #252526; border: 1px solid #3c3c3c; border-radius: 4px; display: flex; flex-direction: column; }
        .sidebar-header { padding: 10px; font-weight: bold; background: #2d2d2d; border-bottom: 1px solid #3c3c3c; display: flex; justify-content: space-between; align-items: center; }
        .file-list { flex: 1; overflow-y: auto; padding: 5px 0; }
        .file-item { padding: 6px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .file-item:hover { background: #2a2d2e; }
        .file-item.active { background: #37373d; font-weight: bold; color: #4ec9b0; }
        .delete-btn { color: #888; cursor: pointer; font-size: 11px; }
        .delete-btn:hover { color: #f48771; }

        /* Main Workspace & Output */
        .main-pane { flex: 1; display: flex; flex-direction: column; gap: 10px; }
        #editor { flex: 2; border: 1px solid #3c3c3c; border-radius: 4px; min-height: 300px; }
        
        .output-pane { flex: 1; background: #1e1e1e; border: 1px solid #3c3c3c; border-radius: 4px; display: flex; flex-direction: column; }
        .output-header { background: #2d2d2d; padding: 6px 12px; font-weight: bold; font-size: 12px; border-bottom: 1px solid #3c3c3c; }
        #console-output { flex: 1; background: #000; color: #00ff66; padding: 10px; font-family: 'Courier New', monospace; overflow-y: auto; white-space: pre-wrap; margin: 0; }

        /* Dashboard Styling */
        .stats-bar { display: flex; gap: 15px; padding: 8px 10px; font-weight: bold; border-bottom: 1px solid #333; font-size: 13px; }
        .test-card { background: #252526; border-left: 4px solid #454545; padding: 8px; margin: 6px; border-radius: 2px; }
        .test-card.passed { border-left-color: #28a745; }
        .test-card.failed { border-left-color: #dc3545; }
        .test-error { color: #f48771; font-family: monospace; font-size: 11px; margin-top: 5px; white-space: pre-wrap; background: #2d1616; padding: 6px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <input type="text" id="jdkPath" placeholder="JDK Path (auto-detected if blank)" style="width: 280px;" />
        
        <label style="font-size: 13px;">Target Class:</label>
        <select id="targetClassSelect"></select>

        <button class="btn-run" onclick="runCoreJava()">▶ Run Core Java</button>
        <button class="btn-test" onclick="runJUnitTest()">🧪 Run JUnit Test</button>
    </div>

    <div class="workspace-container">
        <!-- Sidebar Tree View -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>PROJECT FILES</span>
                <button style="padding: 2px 8px; font-size: 11px; background: #0e639c;" onclick="createNewFile()">+ New File</button>
            </div>
            <div id="fileList" class="file-list"></div>
        </div>

        <!-- Editor & Output -->
        <div class="main-pane">
            <div id="editor"></div>
            
            <div class="output-pane">
                <div class="output-header">Execution & Test Console</div>
                <div id="console-output">Output will appear here...</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    <script>
        let editor;
        let activeFileId = null;

        // In-memory project files representation
        let files = [
            {
                id: '1',
                name: 'Main.java',
                path: 'Main.java',
                content: `public class Main {\n    public static void main(String[] args) {\n        Calculator calc = new Calculator();\n        System.out.println("2 + 3 = " + calc.add(2, 3));\n    }\n}`
            },
            {
                id: '2',
                name: 'Calculator.java',
                path: 'Calculator.java',
                content: `public class Calculator {\n    public int add(int a, int b) {\n        return a + b;\n    }\n    public int multiply(int a, int b) {\n        return a * b;\n    }\n}`
            },
            {
                id: '3',
                name: 'CalculatorTest.java',
                path: 'CalculatorTest.java',
                content: `import org.junit.jupiter.api.Test;\nimport static org.junit.jupiter.api.Assertions.*;\n\npublic class CalculatorTest {\n    @Test\n    void testAdd() {\n        Calculator calc = new Calculator();\n        assertEquals(5, calc.add(2, 3));\n    }\n\n    @Test\n    void testMultiply() {\n        Calculator calc = new Calculator();\n        assertEquals(6, calc.multiply(2, 3));\n    }\n}`
            }
        ];

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            // Register Basic Autocomplete
            monaco.languages.registerCompletionItemProvider('java', {
                provideCompletionItems: function(model, position) {
                    return {
                        suggestions: [
                            { label: 'sout', kind: monaco.languages.CompletionItemKind.Snippet, insertText: 'System.out.println("${1}");', insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet },
                            { label: 'main', kind: monaco.languages.CompletionItemKind.Snippet, insertText: 'public static void main(String[] args) {\n\t${1}\n}', insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet }
                        ]
                    };
                }
            });

            editor = monaco.editor.create(document.getElementById('editor'), {
                language: 'java',
                theme: 'vs-dark',
                automaticLayout: true
            });

            // Save active editor content back to file array on change
            editor.onDidChangeModelContent(() => {
                if (activeFileId) {
                    const currentFile = files.find(f => f.id === activeFileId);
                    if (currentFile) currentFile.content = editor.getValue();
                }
            });

            renderSidebar();
            selectFile('1');
        });

        // Auto-fetch JDK path on load
        window.addEventListener('DOMContentLoaded', async () => {
            const res = await fetch('/api/jdk-path');
            const data = await res.json();
            if (data.jdkPath) document.getElementById('jdkPath').value = data.jdkPath;
        });

        function renderSidebar() {
            const listEl = document.getElementById('fileList');
            const selectEl = document.getElementById('targetClassSelect');
            
            listEl.innerHTML = '';
            selectEl.innerHTML = '';

            files.forEach(file => {
                // Render tree list
                const item = document.createElement('div');
                item.className = `file-item ${file.id === activeFileId ? 'active' : ''}`;
                item.onclick = () => selectFile(file.id);
                item.innerHTML = `
                    <span>📄 ${file.path}</span>
                    ${files.length > 1 ? `<span class="delete-btn" onclick="deleteFile(event, '${file.id}')">✕</span>` : ''}
                `;
                listEl.appendChild(item);

                // Populate Class dropdown options
                const className = file.path.replace(/\//g, '.').replace(/\.java$/, '');
                const option = document.createElement('option');
                option.value = className;
                option.textContent = className;
                selectEl.appendChild(option);
            });
        }

        function selectFile(id) {
            activeFileId = id;
            const file = files.find(f => f.id === id);
            if (file && editor) {
                editor.setValue(file.content);
            }
            renderSidebar();
        }

        function createNewFile() {
            const filePath = prompt("Enter file path (e.g., com/example/Service.java or Helper.java):");
            if (!filePath || !filePath.endsWith('.java')) {
                alert("Please enter a valid .java file name.");
                return;
            }

            const fileName = filePath.split('/').pop();
            const className = fileName.replace('.java', '');
            
            const newFile = {
                id: Date.now().toString(),
                name: fileName,
                path: filePath,
                content: `public class ${className} {\n\n}`
            };

            files.push(newFile);
            selectFile(newFile.id);
        }

        function deleteFile(event, id) {
            event.stopPropagation();
            files = files.filter(f => f.id !== id);
            if (activeFileId === id) {
                selectFile(files[0].id);
            } else {
                renderSidebar();
            }
        }

        // --- RUN CORE JAVA PROGRAM ---
        async function runCoreJava() {
            const jdkPath = document.getElementById('jdkPath').value;
            const mainClass = document.getElementById('targetClassSelect').value;
            const consoleDiv = document.getElementById('console-output');

            consoleDiv.textContent = "Compiling project and running " + mainClass + "...";

            try {
                const response = await fetch('/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jdkPath, files, mainClass })
                });

                const data = await response.json();
                consoleDiv.textContent = data.output;
            } catch (err) {
                consoleDiv.textContent = "Error executing request: " + err.message;
            }
        }

        // --- RUN JUNIT TEST ---
        async function runJUnitTest() {
            const jdkPath = document.getElementById('jdkPath').value;
            const testClass = document.getElementById('targetClassSelect').value;
            const consoleDiv = document.getElementById('console-output');

            consoleDiv.textContent = "Compiling project and running JUnit test suite: " + testClass + "...";

            try {
                const response = await fetch('/api/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jdkPath, files, testClass })
                });

                const data = await response.json();

                if (!data.success) {
                    consoleDiv.textContent = "Compilation/Execution Error:\n" + data.output;
                    return;
                }

                const r = data.results;
                const passedCount = r.total - r.failures - r.errors - r.skipped;

                let outputHtml = `JUnit Execution Summary:\nPassed: ${passedCount}/${r.total} | Failed: ${r.failures} | Time: ${r.time}s\n\n`;
                
                r.tests.forEach(t => {
                    outputHtml += `[${t.passed ? 'PASSED' : 'FAILED'}] ${t.name} (${t.time}s)\n`;
                    if (t.message) outputHtml += `   └── Error: ${t.message}\n`;
                });

                consoleDiv.textContent = outputHtml;
            } catch (err) {
                consoleDiv.textContent = "Error executing test request: " + err.message;
            }
        }
    </script>
</body>
</html>
